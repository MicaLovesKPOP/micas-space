name: Update Reuters World RSS

on:
  schedule:
    # Hourly is plenty for an RSS supplement; NOS handles breaking-news push alerts.
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "feeds/news/build_reuters_world.py"
      - ".github/workflows/reuters-world-feed.yml"

permissions:
  contents: write

jobs:
  build-feed:
    # Avoid rebuilding when the bot commits only generated feed/debug files.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4

      - name: Build Reuters World feed
        run: python feeds/news/build_reuters_world.py

      - name: Commit changed feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/news/reuters-world.xml feeds/news/reuters-world-debug.json
          if git diff --cached --quiet; then
            echo "No Reuters feed changes to commit."
            exit 0
          fi
          git commit -m "Update Reuters World feed"
          git push
