name: Update curated K-pop RSS

on:
  schedule:
    # Twice per hour, staggered away from the car feed.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "feeds/kpop/**"
      - ".github/workflows/kpop-curated-feed.yml"

permissions:
  contents: write

jobs:
  build-feed:
    # Avoid a recursive rebuild when the bot commits generated RSS/debug files.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed dependencies
        run: python -m pip install --disable-pip-version-check feedparser beautifulsoup4

      - name: Build curated K-pop feed
        run: python feeds/kpop/build_feed_v2.py

      - name: Commit changed feed
        run: |
          if git diff --quiet -- feeds/kpop/micas-kpop-feed.xml feeds/kpop/filter-debug.json; then
            echo "No K-pop feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds/kpop/micas-kpop-feed.xml feeds/kpop/filter-debug.json
          git commit -m "Update curated K-pop feed"
          git push
